name: Generate Pac-Man Contribution Graph

on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Generate Pac-Man contribution graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      - name: Crop bottom whitespace
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          for file in Path("dist").glob("*.svg"):
              text = file.read_text()

              svg_match = re.search(r'<svg\b([^>]*)>', text)
              if not svg_match:
                  continue

              svg_tag = svg_match.group(0)

              viewbox = re.search(
                  r'viewBox=["\']([^"\']+)["\']',
                  svg_tag
              )

              if not viewbox:
                  print(f"No viewBox found: {file}")
                  continue

              x, y, width, height = map(
                  float,
                  viewbox.group(1).split()
              )

              # Amount of bottom whitespace to remove
              crop = 100

              new_height = max(1, height - crop)

              # Update viewBox
              new_viewbox = (
                  f"{x:g} {y:g} {width:g} {new_height:g}"
              )

              svg_tag = (
                  svg_tag[:viewbox.start(1)]
                  + new_viewbox
                  + svg_tag[viewbox.end(1):]
              )

              # Update explicit SVG height if present
              height_attr = re.search(
                  r'\bheight=["\']([0-9.]+)(?:px)?["\']',
                  svg_tag
              )

              if height_attr:
                  old_render_height = float(
                      height_attr.group(1)
                  )

                  new_render_height = (
                      old_render_height
                      * new_height
                      / height
                  )

                  svg_tag = (
                      svg_tag[:height_attr.start(1)]
                      + f"{new_render_height:g}"
                      + svg_tag[height_attr.end(1):]
                  )

              text = (
                  text[:svg_match.start()]
                  + svg_tag
                  + text[svg_match.end():]
              )

              file.write_text(text)

              print(
                  f"Cropped {file}: "
                  f"{height:g}px -> {new_height:g}px"
              )
          PY

      - name: Push SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}